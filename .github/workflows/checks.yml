name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install pinned shell tools
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/mvdan/sh/releases/download/v3.13.1/shfmt_v3.13.1_linux_amd64 \
            --output /tmp/shfmt
          echo "fb096c5d1ac6beabbdbaa2874d025badb03ee07929f0c9ff67563ce8c75398b1  /tmp/shfmt" \
            | sha256sum --check
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt

          curl --fail --location --silent --show-error \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output /tmp/shellcheck.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" \
            | sha256sum --check
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 \
            /tmp/shellcheck-v0.11.0/shellcheck \
            /usr/local/bin/shellcheck
      - name: Run complete quality gate
        run: python tools/check.py

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2025
            python: "3.12"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline suite and CLI smokes
        run: python -m unittest discover -s tests -q
